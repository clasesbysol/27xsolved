<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1768ac" />
  <meta name="description" content="27xSOLved, una plataforma educativa independiente para organizar, practicar y conservar lo aprendido." />
  <meta name="application-name" content="27xSOLved" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="27xSOLved" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/brand/favicon-32.png" />
  <link rel="apple-touch-icon" href="./assets/brand/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="./styles-v2.css" />
  <title>27xSOLved · Tu espacio de estudio</title>
</head>
<body>
  <div id="app" class="loading">Abriendo 27xSOLved…</div>

  <script>
    window.__cbcBootError = function(message){
      var el=document.getElementById('app');
      if(!el) return;
      el.className='';
      el.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;background:#f5f7fb;color:#142238"><section style="max-width:560px;background:white;border:1px solid #dce3ed;border-radius:18px;padding:28px"><h1 style="margin:10px 0 8px">27xSOLved</h1><p style="line-height:1.5">La app encontró un problema al iniciar.</p><p style="font-size:13px;opacity:.7;word-break:break-word">'+String(message||'Error desconocido').replace(/[&<>]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]})+'</p><button onclick="location.reload()" style="margin-top:12px;border:0;border-radius:10px;padding:12px 18px;background:#1768ac;color:white;font-weight:700;cursor:pointer">Reintentar</button></section></main>';
    };
    window.addEventListener('error',function(e){
      if(document.getElementById('app') && document.getElementById('app').classList.contains('loading')){
        window.__cbcBootError((e.message||'Error de JavaScript')+(e.filename?' · '+e.filename.split('/').pop()+':'+e.lineno:''));
      }
    });
    window.addEventListener('unhandledrejection',function(e){
      if(document.getElementById('app') && document.getElementById('app').classList.contains('loading')){
        window.__cbcBootError(e.reason && e.reason.message ? e.reason.message : 'Error de conexión al iniciar');
      }
    });
    window.setTimeout(function(){
      var el=document.getElementById('app');
      if(el && el.classList.contains('loading')) window.__cbcBootError('El inicio tardó demasiado. Probá Reintentar.');
    },12000);
  </script>

  <script src="./config.js"></script>
  <script src="./physics-content.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="./physics-admin-guide.js"></script>
  <script defer src="./physics-cheatsheet.js"></script>
  <script defer src="./admin-access-fix.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
