    .xb-liquid{animation:xbWave 1.4s linear infinite}

    @keyframes xbFill{to{transform:translateY(0)}}
    @keyframes xbSlosh{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-2px) rotate(1.5deg)}}
    @keyframes xbWave{from{transform:translateX(0)}to{transform:translateX(-50px)}}
    @keyframes xbBub{0%{opacity:0;transform:translateY(0)}20%{opacity:.95}100%{opacity:0;transform:translateY(-70px)}}
    @keyframes xbPop{0%{transform:scale(1)}45%{transform:scale(1.12) rotate(10deg)}100%{transform:scale(1) rotate(12deg)}}
    @keyframes xbWink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
    @media (prefers-reduced-motion:reduce){.xb-rays,.xb-liquid,.xb-bub,.xb-fill{animation:none!important}.xb-fill{transform:translateY(0)}}
